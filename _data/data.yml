education:
  show: true
  order: 3
  title: Education
  items:
    - institution: University of West Attica, Athens
      link: "https://www.uniwa.gr/en/"
      date: 2021 - 2022
      degree: Master in Wireless Sensor Networks
      description: |

        **Thesis:** Development of optimization schemes for Wireless Sensor Networks

        Grade of Thesis: Excellent (10/10)

        *The purpose of this master is the study of existing methodologies and the development of new methodologies of this kind,
        that aim to maximize coverage and multiple coverage in wireless sensor networks, optimizing the placement of the sensor
        nodes existing within the network field. The solution to the specific problems was investigated using genetic algorithms (GA),
        and the particle swarm optimization (PSO) algorithm.Through a series of scalable experiments, the performance of the control schemes
        developed was evaluated. In particular, in the initial experiments the possibility of achieving the maximization of the coverage of the
        space was verified and in the subsequent ones, the possibility of the control schemes to achieve additional and k-coverage was investigated.
        Finally, the performance of the control schemes developed was compared with that of two popular algorithms of this kind.*

